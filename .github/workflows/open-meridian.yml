# This fork's own check (open-meridian/): OpenCode, built from this branch,
# working a local Open Meridian deployment as one person, through the
# deployment's MCP server alone.
#
# The deployment is the released chart on a k3d cluster made on the runner,
# installed by the released CLI; both are pinned below. No platform is reached:
# open-meridian/ci/first_run.py writes what first run writes. The model is the
# scripted one (open-meridian/ci/scripted_model.py): no key, no real model.
name: open-meridian

on:
  pull_request:
    branches: [open-meridian]
  push:
    branches: [open-meridian]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-meridian-${{ github.ref }}
  cancel-in-progress: false

env:
  # The released CLI and the chart its documentation describes.
  MERIDIAN_CLI_VERSION: v0.1.61
  MERIDIAN_CLI_SHA256: 1e51085c2dd8e5a418ecc936a5ace7bbd10db2e06d7c72176c0edde4b24abdfa
  CHART_VERSION: 0.1.632
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
  HELM_VERSION: v3.19.0
  HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
  MODEL_PORT: "18081"
  SCRIPTED_MODEL_KEY: not-a-key

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Paths, names and licences in what we add
        run: |
          git fetch --no-tags --depth=1 origin open-meridian
          BASE_REF=FETCH_HEAD open-meridian/ci/checks.sh

      - name: Bun, and the workspace's dependencies
        uses: ./.github/actions/setup-bun

      - name: Build OpenCode from this branch
        working-directory: packages/cli
        run: |
          bun run script/build.ts --single --skip-install
          echo "OPENCODE=$PWD/dist/cli-linux-x64/bin/opencode" >>"$GITHUB_ENV"

      - name: The one upstream line we change, the client's name, by upstream's own test
        working-directory: packages/core
        run: bun test test/mcp-oauth.test.ts

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Python packages and a headless browser
        run: |
          python -m pip install argon2-cffi==25.1.0 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: The released CLI, k3d and Helm, each checked against its pinned checksum
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          curl -fsSL -o /tmp/meridian \
            "https://github.com/open-meridian/meridian-cli/releases/download/${MERIDIAN_CLI_VERSION}/meridian-x86_64-unknown-linux-musl"
          echo "${MERIDIAN_CLI_SHA256}  /tmp/meridian" | sha256sum -c -
          install -m 0755 /tmp/meridian "$HOME/.local/bin/meridian"
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          install -m 0755 /tmp/k3d "$HOME/.local/bin/k3d"
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          "$HOME/.local/bin/meridian" --version

      - name: A run directory, the person's home, and the example workspace
        run: |
          run_dir="$RUNNER_TEMP/p1"
          mkdir -p "$run_dir/home"
          chmod 700 "$run_dir"
          {
            echo "RUN_DIR=$run_dir"
            echo "KUBECONFIG=$run_dir/kubeconfig"
            echo "WORK=$run_dir/workspace"
            echo "HOME=$run_dir/home"
            echo "XDG_CONFIG_HOME=$run_dir/home/.config"
            echo "XDG_DATA_HOME=$run_dir/home/.local/share"
            echo "XDG_STATE_HOME=$run_dir/home/.local/state"
            echo "XDG_CACHE_HOME=$run_dir/home/.cache"
          } >>"$GITHUB_ENV"
          cp -R open-meridian/workspace "$run_dir/workspace"
          cp open-meridian/ci/overlay.jsonc "$run_dir/workspace/.opencode/opencode.jsonc"

      - name: A deployment, from the released chart
        run: open-meridian/ci/deployment.sh

      - name: First run, and one person
        run: python open-meridian/ci/first_run.py "$RUN_DIR"

      - name: "Step 1: sign in through the dashboard, unchanged, and list its tools"
        env:
          ROWS: deployment_admin
        run: open-meridian/ci/sign-in.sh

      - name: "Step 1: one scripted run lists the deployment's tools"
        run: |
          open-meridian/ci/run-flow.sh list-tools open-meridian/ci/flows/list-tools.json \
            "List what is prepared for me."
          python - <<'PY'
          import json, os
          offered = json.load(open(os.path.join(os.environ["RUN_DIR"], "list-tools", "offered-tools.json")))
          deployment = [t for t in offered if t.startswith("meridian_")]
          print(f"the scripted model was offered {len(deployment)} deployment tools")
          assert any(t.endswith("dashboard__list_prepared") for t in deployment), deployment
          PY

      - name: "The credential store is its owner's alone"
        run: |
          found=0
          while IFS= read -r -d '' db; do
            found=1
            mode="$(stat -c '%a' "$db")"
            echo "$(basename "$db"): mode $mode"
            [ "$mode" = 600 ] || { echo "the fork's database is readable by others (mode $mode)" >&2; exit 1; }
          done < <(find "$HOME" -type f \( -name '*.db' -o -name '*.sqlite' \) -print0)
          [ "$found" = 1 ] || { echo "no credential store found under the person's home" >&2; exit 1; }

      # The order step (optional): it needs a plugin holding `portfolio`,
      # built from a repository named by the variable ORDER_PLUGIN_REPOSITORY
      # and read with the secret ORDER_PLUGIN_READ_TOKEN. Without them it is
      # skipped, with a notice; nothing else depends on it.
      - name: "Order step: is its plugin available?"
        id: order
        env:
          TOKEN_GIVEN: ${{ secrets.ORDER_PLUGIN_READ_TOKEN != '' }}
          REPOSITORY: ${{ vars.ORDER_PLUGIN_REPOSITORY }}
        run: |
          if [ "$TOKEN_GIVEN" = true ] && [ -n "$REPOSITORY" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=Order step skipped::No ORDER_PLUGIN_READ_TOKEN secret or ORDER_PLUGIN_REPOSITORY variable here, so the order step does not run. It needs a plugin holding portfolio."
          fi

      - name: "Order step: the plugin's source"
        if: steps.order.outputs.run == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ vars.ORDER_PLUGIN_REPOSITORY }}
          token: ${{ secrets.ORDER_PLUGIN_READ_TOKEN }}
          path: order-plugin
          persist-credentials: false

      - name: "Order step: its image, built as its own CI builds it, in the cluster"
        if: steps.order.outputs.run == 'true'
        working-directory: order-plugin
        run: |
          make image IMAGE=order-plugin:ci
          k3d image import order-plugin:ci --cluster p1-agent
          echo "::notice title=Order step::The plugin's image is in the cluster. Launching it and the order flow are not written yet."
          exit 1

      - name: What the deployment and the runs said, when a step failed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/kept"
          kubectl get pods -A -o wide >"$RUNNER_TEMP/kept/pods.txt" 2>&1 || true
          kubectl -n meridian get events --sort-by=.lastTimestamp >"$RUNNER_TEMP/kept/events.txt" 2>&1 || true
          for c in dashboard conductor; do
            kubectl -n meridian logs "deploy/meridian-meridian-runtime-$c" --tail=400 \
              >"$RUNNER_TEMP/kept/$c.log" 2>&1 || true
          done
          # Names, steps and the CLI's own output only: never person.json,
          # the kubeconfig or the fork's credential store.
          cp "$RUN_DIR"/meridian-up.log "$RUN_DIR"/mcp-list.txt "$RUNNER_TEMP/kept/" 2>/dev/null || true
          for run in "$RUN_DIR"/*/; do
            name="$(basename "$run")"
            case "$name" in home|workspace) continue ;; esac
            mkdir -p "$RUNNER_TEMP/kept/$name"
            cp "$run"steps.jsonl "$run"offered-tools.json "$run"run.stderr "$RUNNER_TEMP/kept/$name/" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: open-meridian-run
          path: ${{ runner.temp }}/kept
          if-no-files-found: ignore
